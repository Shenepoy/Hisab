name: Signing key recovery (encrypted)
on:
  workflow_dispatch:
    inputs:
      app_ref:
        type: string
        default: v0.8.0
        description: Release requiring the registered upload key
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify registered certificate and encrypt transfer
        env:
          LEGACY_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LEGACY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LEGACY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LEGACY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RECIPIENT_CERT_BASE64: 
        run: |
          umask 077
          python3 - <<'PYCODE'
          import base64,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          key=root/'legacy-upload.jks';plain=root/'registered-upload.json';cert=root/'recipient.pem'
          try:
              key.write_bytes(base64.b64decode(os.environ['LEGACY_KEYSTORE_BASE64'],validate=True))
              result=subprocess.run(['keytool','-list','-v','-keystore',str(key),'-storepass:env','LEGACY_STORE_PASSWORD','-alias',os.environ['LEGACY_KEY_ALIAS']],check=True,capture_output=True,text=True)
              actual=re.search(r'SHA1:\s*([A-Fa-f0-9:]+)',result.stdout)[1].upper()
              expected='BB:82:C3:D3:45:06:D3:EA:B4:9A:49:DC:1E:CB:26:99:1E:C5:2A:F5'
              print('Legacy certificate SHA1:',actual)
              if actual!=expected: raise SystemExit('Legacy certificate does not match Play; no credential was exported')
              payload={name:os.environ[name] for name in ['LEGACY_KEYSTORE_BASE64','LEGACY_STORE_PASSWORD','LEGACY_KEY_ALIAS','LEGACY_KEY_PASSWORD']}
              plain.write_text(json.dumps(payload));cert.write_bytes(base64.b64decode(os.environ['RECIPIENT_CERT_BASE64']))
              subprocess.run(['openssl','cms','-encrypt','-aes-256-gcm','-binary','-in',str(plain),'-outform','DER','-out',str(root/'registered-upload.enc'),str(cert)],check=True)
              print('Verified Play upload certificate; authenticated encrypted export ready')
          finally:
              for file in [key,plain,cert]: file.unlink(missing_ok=True)
          PYCODE
      - name: Upload encrypted transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registered-upload-encrypted
          path: ${{ runner.temp }}/registered-upload.enc
          retention-days: 1
