name: Release (local-only build)

# Ships the public local-only Android application. The workflow has no service
# credentials. Stable vX.Y.Z tags build signed FOSS APKs. Preview vX.Y.Z-test
# tags create an empty draft prerelease after checks and never build a
# release APK — the private Staging workflow attaches debug cloud APKs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Only the jobs that publish a release need to write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  classify:
    name: Classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Classify ref
        id: classify
        run: bash ./scripts/ci/classify_release_ref.sh "${{ github.ref }}" "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Static release checks
        run: bash ./scripts/run_release_checks.sh

      - name: Assert the tree is local-only
        run: bash ./scripts/ci/assert_offline_only.sh

      - name: Flutter pub get
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

  build-foss:
    name: Build FOSS APKs
    if: ${{ needs.classify.outputs.kind != 'preview' }}
    needs: [classify, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk
        run: bash ./scripts/ci/free_disk_space.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # A release builds three obfuscated ABIs from cold; the restored Gradle
      # cache is the difference between minutes and tens of minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.FOSS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOSS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOSS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOSS_KEY_PASSWORD }}
        run: bash ./scripts/ci/build_android.sh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: foss-apk
          retention-days: 7
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-foss-release.apk
            build/app/outputs/flutter-apk/app-x86_64-foss-release.apk

      - name: Upload Dart symbol maps
        uses: actions/upload-artifact@v7
        with:
          name: foss-symbols
          retention-days: 7
          path: build/app/outputs/symbols/

  github-release:
    name: GitHub Release
    if: ${{ needs.classify.outputs.kind == 'stable' }}
    needs: [classify, build-foss]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: foss-apk

      - name: Checkout for version metadata
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Write APK checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app-*-foss-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No FOSS APKs were downloaded" >&2
            exit 1
          fi
          sha256sum "${apks[@]}" > SHA256SUMS
          python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*([0-9.]+)\+(\d+)", text, re.M)
          if not match:
              raise SystemExit("Could not read version from pubspec.yaml")
          pathlib.Path("update.json").write_text(
              json.dumps(
                  {"version": match.group(1), "versionCode": int(match.group(2))},
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app-armeabi-v7a-foss-release.apk
            app-arm64-v8a-foss-release.apk
            app-x86_64-foss-release.apk
            SHA256SUMS
            update.json

  preview-release:
    name: Preview Release
    if: ${{ needs.classify.outputs.kind == 'preview' }}
    needs: [classify, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create empty draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            Preview / test build. This tag does not include signed FOSS
            release APKs. Cloud debug APKs are attached by the private
            Staging workflow.
